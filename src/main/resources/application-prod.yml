spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.example.employeemanagement: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    admin:
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
